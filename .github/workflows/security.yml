name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit -r requirements.txt

    - name: Run Bandit (Security Scan)
      run: bandit -r src/ core/ -f txt

    - name: Audit Python dependencies
      # O Streamlit 1.54 exige pillow<13; as correções publicadas estão só no Pillow 13.
      run: |
        pip-audit -r requirements.txt \
          --ignore-vuln CVE-2026-112895 \
          --ignore-vuln CVE-2026-112400 \
          --ignore-vuln CVE-2026-112397 \
          --ignore-vuln CVE-2026-112896 \
          --ignore-vuln CVE-2026-112897 \
          --ignore-vuln CVE-2026-112395 \
          --ignore-vuln CVE-2026-112404 \
          --ignore-vuln CVE-2026-112899
