name: CI Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.3.5" pytest -r requirements.txt

    - name: Run Ruff (Linting & Formatting Check)
      run: |
        ruff check .
        ruff format --check .

    - name: Run Pytest
      run: |
        pytest tests/ -v
