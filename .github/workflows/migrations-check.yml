name: Migrations Check

on:
  push:
    branches: [ main ]
    paths:
      - "infra/migrations/**"
      - "infra/init-db.sql"
      - "infra/check_migrations.py"
      - "infra/apply-migrations.sh"
      - "infra/init-pipeline-role.sh"
      - "infra/init-lifecycle-role.sh"
      - "infra/init-readonly-role.sh"
      - ".github/workflows/migrations-check.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "infra/migrations/**"
      - "infra/init-db.sql"
      - "infra/check_migrations.py"
      - "infra/apply-migrations.sh"
      - "infra/init-pipeline-role.sh"
      - "infra/init-lifecycle-role.sh"
      - "infra/init-readonly-role.sh"
      - ".github/workflows/migrations-check.yml"

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spy_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mineracao_fb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spy_admin -d mineracao_fb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: spy_admin
      POSTGRES_DB: mineracao_fb
      PGUSER: spy_admin
      PGDATABASE: mineracao_fb
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar idempotência e registro em schema_migrations
        run: python3 infra/check_migrations.py

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Aplicar schema base (infra/init-db.sql)
        run: psql -v ON_ERROR_STOP=1 -f infra/init-db.sql

      - name: Criar roles pipeline_writer, lifecycle_writer e streamlit_readonly
        env:
          PIPELINE_DB_PASSWORD: ci_pipeline_password
          LIFECYCLE_DB_PASSWORD: ci_lifecycle_password
          STREAMLIT_DB_PASSWORD: ci_readonly_password
        run: |
          sh infra/init-pipeline-role.sh
          sh infra/init-lifecycle-role.sh
          sh infra/init-readonly-role.sh

      - name: Validar sintaxe de cada migração (BEGIN; ...; ROLLBACK;)
        run: |
          set -eu
          for arquivo in infra/migrations/*.sql; do
            echo "Validando $arquivo"
            { echo "BEGIN;"; cat "$arquivo"; echo "ROLLBACK;"; } | psql -v ON_ERROR_STOP=1
          done

      - name: Atualizar a partir do schema da branch base (como um volume existente)
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:infra/init-db.sql > /tmp/init-db-base.sql
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE upgrade_check"
          export PGDATABASE=upgrade_check
          psql -v ON_ERROR_STOP=1 -f /tmp/init-db-base.sql
          for arquivo in $(sed -n 's#^[[:space:]]*\(infra/migrations/[^[:space:]]*\.sql\).*#\1#p' infra/apply-migrations.sh); do
            versao=$(basename "$arquivo" .sql)
            aplicada=$(psql -tA -v ON_ERROR_STOP=1 -c "SELECT 1 FROM schema_migrations WHERE versao = '$versao'")
            if [ "$aplicada" = "1" ]; then
              echo "já aplicada sobre o schema base: $versao"
              continue
            fi
            echo "Aplicando $versao sobre o schema da branch base"
            {
              printf 'BEGIN;\n'
              printf "SET LOCAL lock_timeout = '%s';\n" "${MIGRATION_LOCK_TIMEOUT:-5s}"
              cat "$arquivo"
              printf "INSERT INTO schema_migrations (versao) VALUES ('%s');\n" "$versao"
              printf 'COMMIT;\n'
            } | psql -v ON_ERROR_STOP=1
          done

      - name: Comparar schema novo (init-db.sql) com o schema atualizado
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          cat > /tmp/schema.sql <<'SQL'
          SELECT 'col ' || c.relname || '.' || a.attname || ' ' || format_type(a.atttypid, a.atttypmod)
                 || ' notnull=' || a.attnotnull || ' default=' || coalesce(pg_get_expr(d.adbin, d.adrelid), '')
          FROM pg_attribute a
          JOIN pg_class c ON c.oid = a.attrelid AND c.relkind = 'r'
          JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = 'public'
          LEFT JOIN pg_attrdef d ON d.adrelid = a.attrelid AND d.adnum = a.attnum
          WHERE a.attnum > 0 AND NOT a.attisdropped
          UNION ALL
          SELECT 'idx ' || indexdef FROM pg_indexes WHERE schemaname = 'public'
          UNION ALL
          SELECT 'con ' || conrelid::regclass || ' ' || conname || ' ' || pg_get_constraintdef(oid)
          FROM pg_constraint WHERE connamespace = 'public'::regnamespace
          UNION ALL
          SELECT 'mig ' || versao FROM schema_migrations
          ORDER BY 1;
          SQL
          PGDATABASE=mineracao_fb psql -tA -v ON_ERROR_STOP=1 -f /tmp/schema.sql > /tmp/schema_novo.txt
          PGDATABASE=upgrade_check psql -tA -v ON_ERROR_STOP=1 -f /tmp/schema.sql > /tmp/schema_upgrade.txt
          diff -u /tmp/schema_novo.txt /tmp/schema_upgrade.txt
